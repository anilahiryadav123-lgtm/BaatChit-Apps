name: BaatChit APK + Push Server

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  push:
    name: Push server (Cloudflare, free)
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: for z in BaatChit-GitHub*.zip; do [ -f "$z" ] && unzip -o -q "$z" baatchit-src.zip || true; done; if [ -f baatchit-src.zip ]; then unzip -o -q baatchit-src.zip; fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deploy push server
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PUSH_KEY: ${{ secrets.APP_KEY || format('bc-{0}-push', github.repository_id) }}
        run: bash worker/deploy.sh

  apk:
    name: Build APK
    needs: push
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare project
        env:
          PUSH_URL: ${{ needs.push.outputs.url || secrets.PUSH_URL }}
          PUSH_KEY: ${{ secrets.APP_KEY || format('bc-{0}-push', github.repository_id) }}
        run: |
          for z in BaatChit-GitHub*.zip; do [ -f "$z" ] && unzip -o -q "$z" baatchit-src.zip || true; done; if [ -f baatchit-src.zip ]; then unzip -o -q baatchit-src.zip; fi
          test -d android || { echo "::error::BaatChit-GitHub.zip repo me upload karein"; exit 1; }
          bash android/prepare.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        env:
          DEEPAR_KEY: ${{ secrets.DEEPAR_KEY }}
        run: |
          if [ -z "$DEEPAR_KEY" ]; then echo "::warning::DEEPAR_KEY secret nahi mila - face filters band rahenge (normal camera chalega)"; echo "### ⚠️ DEEPAR_KEY secret add karein (Settings > Secrets > Actions)" >> "$GITHUB_STEP_SUMMARY"; else echo "### ✅ DeepAR face filters ON" >> "$GITHUB_STEP_SUMMARY"; fi
          gradle -p android assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "BaatChit-v${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: BaatChit-APK
          path: BaatChit-v${{ github.run_number }}.apk

      - name: Release (download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: BaatChit v${{ github.run_number }}
          body: "BaatChit APK · phone me download karke install karein"
          files: BaatChit-v${{ github.run_number }}.apk
